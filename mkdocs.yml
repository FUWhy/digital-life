site_name: 数字生活 · 从零开始
site_description: 面向零基础成人的电脑与 AI 数字技能学习平台
site_author: 家庭教学项目

theme:
  name: material
  language: zh
  palette:
    - primary: blue
      accent: blue

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

nav:
  - 首页: index.md
  - 课程目录: public/index.md
  - 电脑基础:
      - 第1课：认识电脑部件: public/01-电脑基础/01-认识电脑部件.md
      - 第2课：开机和关机: public/01-电脑基础/02-开机和关机.md
      - 第3课：认识桌面: public/01-电脑基础/03-认识桌面.md
      - 第4课：鼠标用法: public/01-电脑基础/04-鼠标用法.md
      - 第5课：认识窗口: public/01-电脑基础/05-认识窗口.md
      - 第6课：认识键盘: public/01-电脑基础/06-认识键盘.md
      - 第7课：打开关闭程序: public/01-电脑基础/07-打开关闭程序.md
  - 文件与文件夹:
      - 第8课：认识文件和文件夹: public/02-文件与文件夹/08-认识文件和文件夹.md
      - 第9课：文件资源管理器: public/02-文件与文件夹/09-文件资源管理器.md
      - 第10课：新建和重命名: public/02-文件与文件夹/10-新建和重命名.md
      - 第11课：复制和移动: public/02-文件与文件夹/11-复制和移动.md
      - 第12课：删除和恢复: public/02-文件与文件夹/12-删除和恢复.md
  - 上网与搜索:
      - 第13课：认识浏览器: public/03-上网与搜索/13-认识浏览器.md
      - 第14课：打开网站: public/03-上网与搜索/14-打开网站.md
      - 第15课：搜索信息: public/03-上网与搜索/15-搜索信息.md
      - 第16课：收藏网站: public/03-上网与搜索/16-收藏网站.md
  - 办公软件:
      - 第17课：认识文字处理软件: public/04-办公软件/17-认识文字处理软件.md
      - 第18课：写简单文档: public/04-办公软件/18-写简单文档.md
      - 第19课：认识表格软件: public/04-办公软件/19-认识表格软件.md
      - 第20课：打印文件: public/04-办公软件/20-打印文件.md
      - 第21课：认识PDF文件: public/04-办公软件/21-认识PDF文件.md
  - 内部教学区:
      - private/index.md

plugins:
  - search:
      lang: zh
